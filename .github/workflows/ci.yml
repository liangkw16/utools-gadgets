name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: apps/utools-plus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/utools-plus/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify native helpers
        run: |
          for helper in bluetooth-helper bluetooth-power sound-helper wifi-helper; do
            helper_path="dist/preload/bin/$helper"
            test -x "$helper_path"
            /usr/bin/lipo "$helper_path" -verify_arch arm64 x86_64
            /usr/bin/codesign --verify --all-architectures "$helper_path"
          done
